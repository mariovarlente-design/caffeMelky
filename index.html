<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Melky - Coffee & Eatery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --cream:#FAF8F5; --caramel:#B8860B; --ink:#30251e; --muted:#8f8276; --paper:#ffffff; }
        * { box-sizing:border-box; }
        body { margin:0; font-family:'DM Sans',sans-serif; color:var(--ink); background:#e6cbb4; }
        .serif { font-family:'Fraunces',serif; }
        .scene { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:0; }
        @media(min-width:640px){ .scene { padding:20px; } }
        .app-shell { width:100%; max-width:480px; height:100vh; max-height:900px; background:var(--paper); box-shadow:0 24px 70px rgba(0,0,0,0.2); position:relative; overflow:hidden; display:flex; flex-direction:column; }
        @media(min-width:640px){ .app-shell { border-radius:35px; height:88vh; } }
        .screen { flex:1; overflow-y:auto; padding-bottom:90px; scrollbar-width:thin; }
        .screen[hidden] { display:none !important; }
        .nav { position:absolute; bottom:0; left:0; right:0; background:rgba(255,255,255,0.95); border-top:1px solid #eee8e1; display:grid; grid-template-columns:repeat(5,1fr); z-index:50; padding:10px 8px max(10px,env(safe-area-inset-bottom)); backdrop-filter:blur(12px); }
        .nav button { display:flex; flex-direction:column; align-items:center; gap:3px; color:#988b7d; font-size:10px; font-weight:700; background:none; border:none; cursor:pointer; padding:4px 0; transition:color 0.2s; }
        .nav button.active { color:var(--caramel); }
        .pill { border-radius:999px; padding:7px 16px; background:#f5f1eb; color:#62564b; white-space:nowrap; font-size:12px; font-weight:700; border:none; cursor:pointer; transition:all 0.2s; }
        .pill.active { background:var(--caramel); color:white; }
        .product-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
        .product-card { border:1px solid #efeae4; border-radius:20px; background:#fff; overflow:hidden; text-align:left; transition:transform .2s,box-shadow .2s; display:flex; flex-direction:column; justify-content:between; cursor:pointer; padding:10px; }
        .form-field { width:100%; border:1px solid #e6ddd2; border-radius:14px; padding:12px; background:#faf7f2; outline:none; font-size:13px; }
        .form-field:focus { border-color:var(--caramel); background:#fff; }
        .action-btn { background:var(--caramel); color:#fff; border-radius:14px; font-weight:700; padding:13px 16px; border:none; width:100%; cursor:pointer; transition:background 0.2s; }
        .action-btn:hover { background:#9a6f09; }
    </style>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, setDoc, doc, onSnapshot, query, orderBy, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0ksXFs247mY7sAOlsDmdR_7kCyF5AVOc",
            authDomain: "cafe-melky.firebaseapp.com",
            projectId: "cafe-melky",
            storageBucket: "cafe-melky.firebasestorage.app",
            messagingSenderId: "563981647169",
            appId: "1:563981647169:web:f2815873b51787b9b375c0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cartPelanggan = {};
        let menuCache = [];
        let activeKategoriHome = 'Semua';
        let activeKategoriCatalog = 'Semua';
        let selectedProductForDetail = null;
        let isFirstLoad = true;

        window.addEventListener('DOMContentLoaded', () => {
            let saved = localStorage.getItem('melky_pelanggan');
            if(!saved) {
                window.location.href = 'login.html';
                return;
            }
            let p = JSON.parse(saved);
            document.getElementById('prof-nama-teks').innerText = p.nama;
            document.getElementById('prof-wa-teks').innerText = p.wa;
            document.getElementById('prof-avatar').src = p.foto;
            const cartNama = document.getElementById('cart-nama-pemesan');
            if(cartNama) cartNama.value = p.nama;

            initMenuSync();
            switchScreen('home-screen');
        });

        function updateClock() {
            const el = document.getElementById('realtime-clock');
            if(el) {
                const now = new Date();
                const options = { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' };
                el.innerText = `${now.toLocaleDateString('id-ID', options)} | ${now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}`;
            }
        }
        setInterval(updateClock, 1000);

        function playSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                g.gain.setValueAtTime(0.3, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(g); g.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } catch(e){}
        }

        window.switchScreen = function(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.hidden = true);
            const target = document.getElementById(screenId);
            if(target) target.hidden = false;

            document.querySelectorAll('.nav button').forEach(btn => {
                if(btn.dataset.target === screenId) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            if(screenId === 'cart-screen') renderCart();
            if(screenId === 'orders-screen') loadOrdersRealtime();
            if(screenId === 'catalog-screen') renderCatalogProducts();
            if(screenId === 'home-screen') renderHomeProducts();
            
            const shell = document.querySelector('.app-shell');
            if(shell) shell.scrollTop = 0;
        };

        function initMenuSync() {
            onSnapshot(collection(db, "menu_melky"), (snapshot) => {
                menuCache = [];
                snapshot.forEach(docSnap => {
                    menuCache.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderHomeProducts();
                renderCatalogProducts();
            });
        }

        window.filterHomeCat = function(cat) {
            activeKategoriHome = cat;
            document.querySelectorAll('#home-filters button').forEach(b => {
                b.className = b.dataset.cat === cat ? 'pill active' : 'pill';
            });
            renderHomeProducts();
        };

        function renderHomeProducts() {
            const container = document.getElementById('home-products-container');
            if(!container) return;
            container.innerHTML = '';
            let filtered = menuCache.filter(item => activeKategoriHome === 'Semua' || item.kategori === activeKategoriHome);
            let keyword = (document.getElementById('home-search')?.value || '').toLowerCase();
            if(keyword) filtered = filtered.filter(i => i.nama.toLowerCase().includes(keyword));

            if(filtered.length === 0) {
                container.innerHTML = `<p class="text-xs text-stone-400 col-span-2 text-center py-6">Belum ada menu tersedia.</p>`;
                return;
            }

            filtered.forEach(item => {
                container.innerHTML += `
                    <div class="product-card" onclick="openProductDetail('${item.id}')">
                        <div class="h-32 w-full rounded-xl bg-stone-50 flex items-center justify-center p-2 overflow-hidden relative">
                            <img src="${item.foto || 'https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=500&q=80'}" class="max-h-full max-w-full object-contain">
                            <span class="absolute top-2 left-2 text-[9px] px-2 py-0.5 rounded-full bg-white/90 text-amber-800 font-bold shadow-xs">${item.kategori}</span>
                        </div>
                        <div class="mt-2.5">
                            <h4 class="font-bold text-xs text-stone-900 line-clamp-1">${item.nama}</h4>
                            <p class="text-xs font-extrabold text-amber-700 mt-1">Rp ${item.harga.toLocaleString('id-ID')}</p>
                        </div>
                    </div>
                `;
            });
        }

        window.filterCatalogCat = function(cat) {
            activeKategoriCatalog = cat;
            document.querySelectorAll('#catalog-filters button').forEach(b => {
                b.className = b.dataset.cat === cat ? 'pill active' : 'pill';
            });
            renderCatalogProducts();
        };

        function renderCatalogProducts() {
            const container = document.getElementById('catalog-products-container');
            if(!container) return;
            container.innerHTML = '';
            let filtered = menuCache.filter(item => activeKategoriCatalog === 'Semua' || item.kategori === activeKategoriCatalog);
            let keyword = (document.getElementById('catalog-search')?.value || '').toLowerCase();
            if(keyword) filtered = filtered.filter(i => i.nama.toLowerCase().includes(keyword));

            if(filtered.length === 0) {
                container.innerHTML = `<p class="text-xs text-stone-400 col-span-2 text-center py-8">Produk tidak ditemukan.</p>`;
                return;
            }

            filtered.forEach(item => {
                container.innerHTML += `
                    <div class="product-card" onclick="openProductDetail('${item.id}')">
                        <div class="h-36 w-full rounded-xl bg-stone-50 flex items-center justify-center p-2 overflow-hidden relative">
                            <img src="${item.foto || 'https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=500&q=80'}" class="max-h-full max-w-full object-contain">
                            <span class="absolute top-2 left-2 text-[9px] px-2 py-0.5 rounded-full bg-white/90 text-amber-800 font-bold shadow-xs">${item.kategori}</span>
                        </div>
                        <div class="mt-2.5">
                            <h4 class="font-bold text-xs text-stone-900 line-clamp-1">${item.nama}</h4>
                            <p class="text-xs font-extrabold text-amber-700 mt-1">Rp ${item.harga.toLocaleString('id-ID')}</p>
                        </div>
                    </div>
                `;
            });
        }

        window.openProductDetail = function(id) {
            const item = menuCache.find(i => i.id === id);
            if(!item) return;
            selectedProductForDetail = item;
            document.getElementById('detail-img').src = item.foto || '';
            document.getElementById('detail-name').innerText = item.nama;
            document.getElementById('detail-price').innerText = `Rp ${item.harga.toLocaleString('id-ID')}`;
            document.getElementById('detail-desc').innerText = item.deskripsi || 'Nikmati kelezatan menu pilihan berkualitas dari Kafe Melky.';
            document.getElementById('detail-qty').innerText = '1';
            document.getElementById('detail-suhu').value = 'Es';
            document.getElementById('detail-catatan').value = '';
            document.querySelectorAll('.screen').forEach(s => s.hidden = true);
            document.getElementById('detail-screen').hidden = false;
        };

        window.ubahDetailQty = function(delta) {
            let qEl = document.getElementById('detail-qty');
            let q = parseInt(qEl.innerText) + delta;
            if(q < 1) q = 1;
            qEl.innerText = q;
        };

        window.tambahDdariDetailKeCart = function() {
            if(!selectedProductForDetail) return;
            let qty = parseInt(document.getElementById('detail-qty').innerText);
            let suhu = document.getElementById('detail-suhu').value;
            let catatan = document.getElementById('detail-catatan').value.trim();
            let cartKey = `${selectedProductForDetail.id}-${suhu}-${catatan}`;

            if(cartPelanggan[cartKey]) {
                cartPelanggan[cartKey].qty += qty;
            } else {
                cartPelanggan[cartKey] = {
                    id: selectedProductForDetail.id,
                    nama: selectedProductForDetail.nama,
                    harga: selectedProductForDetail.harga,
                    suhu, catatan, qty
                };
            }
            alert('Berhasil ditambahkan ke keranjang!');
            switchScreen('cart-screen');
        };

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const summary = document.getElementById('cart-summary-box');
            if(!container) return;
            container.innerHTML = '';

            let keys = Object.keys(cartPelanggan);
            if(keys.length === 0) {
                container.innerHTML = `<p class="text-xs text-stone-400 text-center py-12">Keranjang belanja masih kosong.</p>`;
                if(summary) summary.hidden = true;
                return;
            }

            if(summary) summary.hidden = false;
            let total = 0;

            keys.forEach(key => {
                let item = cartPelanggan[key];
                let sub = item.harga * item.qty;
                total += sub;
                let info = `(${item.suhu}${item.catatan ? ', ' + item.catatan : ''})`;

                container.innerHTML += `
                    <div class="flex items-center justify-between bg-stone-50 border border-stone-200/80 p-3 rounded-2xl gap-2">
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-xs text-stone-900">${item.nama} <span class="text-amber-700 text-[10px]">${info}</span></h4>
                            <p class="text-xs font-semibold text-stone-500 mt-0.5">Rp ${item.harga.toLocaleString('id-ID')} x ${item.qty}</p>
                        </div>
                        <div class="flex items-center gap-1 bg-white px-2 py-1 rounded-xl border border-stone-200">
                            <button onclick="updateCartQty('${key}', -1)" class="text-rose-500 font-bold px-1.5 text-xs">-</button>
                            <span class="text-xs font-bold text-stone-800">${item.qty}</span>
                            <button onclick="updateCartQty('${key}', 1)" class="text-emerald-600 font-bold px-1.5 text-xs">+</button>
                        </div>
                        <button onclick="hapusItemCart('${key}')" class="text-rose-500 p-1.5 text-xs font-bold"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
            });
            document.getElementById('cart-total-price').innerText = `Rp ${total.toLocaleString('id-ID')}`;
            loadPaymentConfigToCart();
        }

        window.updateCartQty = function(key, delta) {
            if(cartPelanggan[key]) {
                cartPelanggan[key].qty += delta;
                if(cartPelanggan[key].qty <= 0) delete cartPelanggan[key];
            }
            renderCart();
        };

        window.hapusItemCart = function(key) {
            if(confirm('Hapus menu ini dari keranjang?')) {
                delete cartPelanggan[key];
                renderCart();
            }
        };

        function loadPaymentConfigToCart() {
            onSnapshot(doc(db, "pengaturan_melky", "config"), (docSnap) => {
                const select = document.getElementById('cart-metode-bayar');
                const detailBox = document.getElementById('cart-payment-detail');
                if(!select) return;
                let currVal = select.value;
                select.innerHTML = '';
                let methods = docSnap.exists() && docSnap.data().metodeBayarConfig ? docSnap.data().metodeBayarConfig.split(',') : ['Cash', 'QRIS', 'BCA'];
                methods.forEach(m => { select.innerHTML += `<option value="${m.trim()}">${m.trim()}</option>`; });
                select.value = currVal || methods[0];

                if(docSnap.exists()) {
                    let d = docSnap.data();
                    let val = select.value.toLowerCase();
                    if(val.includes('qris')) {
                        detailBox.innerHTML = `<div class="p-3 bg-stone-50 rounded-2xl text-center border border-amber-500/30 mt-2"><p class="text-[11px] text-amber-800 font-bold mb-1">Scan QRIS Kafe Melky</p><img src="${d.qrisFoto||''}" class="w-32 h-32 object-contain mx-auto bg-white p-1 rounded-xl"></div>`;
                        detailBox.hidden = false;
                    } else if(val.includes('bca') || val.includes('transfer')) {
                        detailBox.innerHTML = `<div class="p-3 bg-stone-50 rounded-2xl text-xs border border-amber-500/30 mt-2 space-y-1"><p class="font-bold text-amber-800">Rekening:</p><p class="font-mono text-stone-700">${d.noRekening||'Belum diatur'}</p></div>`;
                        detailBox.hidden = false;
                    } else { detailBox.hidden = true; }
                }
            });
        }

        window.onMetodeBayarChange = function() { loadPaymentConfigToCart(); };

        window.submitCheckoutOrder = async function() {
            let nama = document.getElementById('cart-nama-pemesan').value.trim();
            let metode = document.getElementById('cart-metode-bayar').value;

            if(!nama) { alert('Silakan isi Nama atau Nomor Meja Anda!'); return; }
            if(Object.keys(cartPelanggan).length === 0) { alert('Keranjang masih kosong!'); return; }

            let total = Object.values(cartPelanggan).reduce((s, i) => s + (i.harga * i.qty), 0);
            let activeWaKasir = "628123456789";

            try {
                let kasirSnap = await getDocs(collection(db, "kasir_melky"));
                kasirSnap.forEach(d => { if(d.data().waKasir) activeWaKasir = d.data().waKasir; });
            } catch(e){}

            activeWaKasir = activeWaKasir.replace(/[^0-9]/g, '');

            let newOrder = {
                idPesanan: 'MLK-' + Date.now().toString().slice(-6),
                waktu: new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) + ' ' + new Date().toLocaleDateString('id-ID'),
                timestamp: Date.now(),
                nama, metodeBayar: metode, items: {...cartPelanggan}, total,
                status: 'Menunggu Konfirmasi'
            };

            try {
                await addDoc(collection(db, "pesanan_melky"), newOrder);
                let waText = `*KAFE MELKY - KONFIRMASI PESANAN*\nPelanggan: *${nama}*\nBayar: *${metode}*\n\n*Rincian Pesanan:*\n`;
                Object.values(cartPelanggan).forEach(i => {
                    waText += `- ${i.nama} [${i.suhu}${i.catatan?', '+i.catatan:''}] (${i.qty}x) : Rp ${(i.harga*i.qty).toLocaleString('id-ID')}\n`;
                });
                waText += `\n*TOTAL: Rp ${total.toLocaleString('id-ID')}*\n\n*Halo Kak, mohon konfirmasi pesanan saya apakah sudah benar?*`;

                if(confirm("Pesanan berhasil dikirim ke Sistem Kasir! Ingin kirim konfirmasi via WhatsApp ke Kasir?")) {
                    window.open(`https://wa.me/${activeWaKasir}?text=${encodeURIComponent(waText)}`, '_blank');
                }

                cartPelanggan = {};
                switchScreen('orders-screen');
            } catch(e) {
                alert("Gagal mengirim pesanan.");
            }
        };

        function loadOrdersRealtime() {
            const container = document.getElementById('orders-list-container');
            if(!container) return;
            const q = query(collection(db, "pesanan_melky"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                if(!isFirstLoad) {
                    let hasNew = false;
                    snapshot.docChanges().forEach(c => { if(c.type === "added") hasNew = true; });
                    if(hasNew) playSound();
                } else { isFirstLoad = false; }

                container.innerHTML = '';
                if(snapshot.empty) {
                    container.innerHTML = `<p class="text-xs text-stone-400 text-center py-12">Belum ada riwayat pesanan.</p>`;
                    return;
                }

                snapshot.forEach(docSnap => {
                    let p = docSnap.data();
                    let itemList = Object.values(p.items).map(i => `${i.nama} (${i.qty}x)`).join(', ');
                    let statusColor = "bg-amber-100 text-amber-800 border-amber-300";
                    let statusText = p.status || "Menunggu Konfirmasi";
                    if(statusText.includes("Disiapkan")) statusColor = "bg-blue-100 text-blue-800 border-blue-300";
                    if(statusText.includes("Selesai") || statusText.includes("Siap")) statusColor = "bg-emerald-100 text-emerald-800 border-emerald-300";

                    container.innerHTML += `
                        <div class="bg-stone-50 border border-stone-200 p-3.5 rounded-2xl space-y-2 shadow-xs">
                            <div class="flex justify-between items-center text-xs">
                                <span class="font-bold text-stone-900">${p.nama}</span>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold border ${statusColor}">${statusText}</span>
                            </div>
                            <p class="text-xs text-stone-600">${itemList}</p>
                            <div class="flex justify-between items-center pt-2 border-t border-stone-200 text-xs">
                                <span class="text-amber-700 font-bold">Bayar: ${p.metodeBayar}</span>
                                <span class="font-extrabold text-stone-900">Rp ${p.total.toLocaleString('id-ID')}</span>
                            </div>
                        </div>
                    `;
                });
            });
        }

        window.logoutPelanggan = function() {
            if(confirm('Keluar dari sesi ini?')) {
                localStorage.removeItem('melky_pelanggan');
                window.location.href = 'login.html';
            }
        };
    </script>
</head>
<body class="scene">
  <main class="app-shell">
    <!-- 1. BERANDA -->
    <section id="home-screen" class="screen">
        <header class="relative bg-[#382419] h-52 overflow-hidden">
            <img src="https://images.pexels.com/photos/2074122/pexels-photo-2074122.jpeg?auto=compress&cs=tinysrgb&w=1280" class="w-full h-full object-cover opacity-60">
            <div class="absolute inset-0 bg-gradient-to-t from-stone-900/80 to-transparent"></div>
            <div class="absolute bottom-4 left-5 right-5 text-white flex justify-between items-end">
                <div>
                    <p class="text-[11px] uppercase tracking-wider font-bold text-amber-400">Selamat Datang</p>
                    <h2 class="serif text-2xl font-bold tracking-wide">Kafe Melky</h2>
                </div>
                <div class="bg-stone-900/80 px-3 py-1.5 rounded-xl text-[11px] font-bold text-amber-300 border border-amber-500/30 text-right">
                    <span id="realtime-clock">Memuat...</span>
                </div>
            </div>
        </header>
        <div class="p-4 space-y-4">
            <input type="search" id="home-search" oninput="renderHomeProducts()"

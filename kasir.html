<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Kasir - Kafe Melky</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --cream:#FAF8F5; --caramel:#B8860B; --ink:#30251e; }
        body { margin:0; font-family:'DM Sans',sans-serif; color:var(--ink); background:#e6cbb4; }
        .serif { font-family:'Fraunces',serif; }
        .scene { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:0; }
        @media(min-width:640px){ .scene { padding:20px; } }
        .app-shell { width:100%; max-width:480px; height:100vh; max-height:900px; background:#fff; box-shadow:0 24px 70px rgba(0,0,0,0.2); position:relative; overflow:hidden; display:flex; flex-direction:column; }
        @media(min-width:640px){ .app-shell { border-radius:35px; height:88vh; } }
        .screen { flex:1; overflow-y:auto; padding:16px; scrollbar-width:thin; }
        .form-field { width:100%; border:1px solid #e6ddd2; border-radius:14px; padding:12px; background:#faf7f2; outline:none; font-size:13px; }
        .form-field:focus { border-color:var(--caramel); background:#fff; }
        .action-btn { background:var(--caramel); color:#fff; border-radius:14px; font-weight:700; padding:13px 16px; border:none; width:100%; cursor:pointer; transition:background 0.2s; }
        .action-btn:hover { background:#9a6f09; }
    </style>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, setDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0ksXFs247mY7sAOlsDmdR_7kCyF5AVOc",
            authDomain: "cafe-melky.firebaseapp.com",
            projectId: "cafe-melky",
            storageBucket: "cafe-melky.firebasestorage.app",
            messagingSenderId: "563981647169",
            appId: "1:563981647169:web:f2815873b51787b9b375c0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activeKasirId = null;
        let activeKasirAkun = null;

        window.addEventListener('DOMContentLoaded', () => {
            activeKasirId = localStorage.getItem('melky_active_kasir');
            if(!activeKasirId) {
                window.location.href = 'login.html';
                return;
            }
            loadAdminData();
        });

        window.exitKasir = function() {
            localStorage.removeItem('melky_active_kasir');
            window.location.href = 'login.html';
        };

        function loadAdminData() {
            // Ambil profil kasir dari Firestore
            getDoc(doc(db, "kasir_melky", activeKasirId)).then((docSnap) => {
                if(docSnap.exists()) {
                    activeKasirAkun = docSnap.data();
                    document.getElementById('kasir-title-badge').innerText = `Panel Admin (${activeKasirAkun.nama || activeKasirId})`;
                    document.getElementById('kasir-set-nama').value = activeKasirAkun.nama || '';
                    document.getElementById('kasir-set-wa').value = activeKasirAkun.waKasir || '';
                    document.getElementById('kasir-profile-img').src = activeKasirAkun.foto || 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=300&q=80';
                }
            });

            // Sinkronisasi Menu
            onSnapshot(collection(db, "menu_melky"), (snap) => {
                const tbody = document.getElementById('admin-menu-tbody');
                if(!tbody) return;
                tbody.innerHTML = '';
                if(snap.empty) {
                    tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-stone-400 text-xs">Belum ada menu.</td></tr>`;
                    return;
                }
                snap.forEach(d => {
                    let m = d.data();
                    tbody.innerHTML += `
                        <tr class="border-b border-stone-100">
                            <td class="p-2"><img src="${m.foto || ''}" class="w-8 h-8 object-contain rounded-lg bg-stone-50"></td>
                            <td class="p-2 font-bold text-stone-800">${m.nama}</td>
                            <td class="p-2 text-amber-700">Rp ${m.harga.toLocaleString('id-ID')}</td>
                            <td class="p-2 text-center space-x-1">
                                <button onclick="adminEditMenu('${d.id}', '${m.nama.replace(/'/g, "\\'")}', ${m.harga}, '${m.kategori}')" class="px-2 py-1 bg-blue-50 text-blue-600 rounded text-[10px] font-bold">Edit</button>
                                <button onclick="adminHapusMenu('${d.id}')" class="px-2 py-1 bg-rose-50 text-rose-600 rounded text-[10px] font-bold">Hapus</button>
                            </td>
                        </tr>
                    `;
                });
            });

            // Sinkronisasi Pengaturan Umum
            onSnapshot(doc(db, "pengaturan_melky", "config"), (docSnap) => {
                if(docSnap.exists()) {
                    let d = docSnap.data();
                    document.getElementById('set-metode').value = d.metodeBayarConfig || 'Cash, QRIS, BCA';
                    document.getElementById('set-rek').value = d.noRekening || '';
                    document.getElementById('set-promo').value = d.runningText || '';
                }
            });

            // Pesanan Masuk Realtime
            const liveTbody = document.getElementById('admin-live-orders-tbody');
            onSnapshot(query(collection(db, "pesanan_melky"), orderBy("timestamp", "desc")), (snap) => {
                if(!liveTbody) return;
                liveTbody.innerHTML = '';
                if(snap.empty) {
                    liveTbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-stone-400">Tidak ada pesanan masuk.</td></tr>`;
                    return;
                }
                snap.forEach(d => {
                    let p = d.data();
                    let list = Object.values(p.items).map(i => `${i.nama} (${i.qty}x)`).join(', ');
                    liveTbody.innerHTML += `
                        <tr class="border-b border-stone-100 text-xs">
                            <td class="p-2 text-stone-500">${p.waktu}</td>
                            <td class="p-2 font-bold text-stone-900">${p.nama}</td>
                            <td class="p-2 text-stone-600">${list}</td>
                            <td class="p-2 font-extrabold text-amber-700">Rp ${p.total.toLocaleString('id-ID')}</td>
                            <td class="p-2 text-center space-x-1">
                                <button onclick="updateStatusPesanan('${d.id}', 'Sedang Disiapkan 👨‍🍳')" class="px-2 py-1 bg-blue-50 text-blue-700 rounded text-[10px] font-bold">Proses</button>
                                <button onclick="updateStatusPesanan('${d.id}', 'Pesanan Siap / Selesai ✅')" class="px-2 py-1 bg-emerald-50 text-emerald-700 rounded text-[10px] font-bold">Selesai</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        window.updateStatusPesanan = async function(id, statusBaru) {
            await updateDoc(doc(db, "pesanan_melky", id), { status: statusBaru });
            alert(`Status diperbarui menjadi: "${statusBaru}"`);
        };

        window.adminSimpanProfilKasir = async function() {
            let nama = document.getElementById('kasir-set-nama').value.trim();
            let waKasir = document.getElementById('kasir-set-wa').value.trim();
            let fileInput = document.getElementById('kasir-set-foto');

            let saveProc = async (fotoUrl) => {
                let payload = { id: activeKasirId, nama, waKasir };
                if(fotoUrl) payload.foto = fotoUrl;
                else if(activeKasirAkun && activeKasirAkun.foto) payload.foto = activeKasirAkun.foto;

                await setDoc(doc(db, "kasir_melky", activeKasirId), payload, {merge:true});
                alert('✨ Profil Kasir berhasil diperbarui!');
                loadAdminData();
            };

            if(fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = async (e) => { await saveProc(e.target.result); };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                await saveProc(null);
            }
        };

        window.adminSimpanMenu = async function() {
            let id = document.getElementById('adm-edit-id').value;
            let nama = document.getElementById('adm-nama').value.trim();
            let harga = parseInt(document.getElementById('adm-harga').value);
            let kategori = document.getElementById('adm-kategori').value;
            let fileInput = document.getElementById('adm-file');

            if(!nama || isNaN(harga)) { alert('Nama dan Harga wajib diisi!'); return; }

            let saveToDb = async (fotoUrl) => {
                if(id) {
                    let data = {nama, harga, kategori};
                    if(fotoUrl) data.foto = fotoUrl;
                    await updateDoc(doc(db, "menu_melky", id), data);
                } else {
                    let fotoFinal = fotoUrl || 'https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=500&q=80';
                    await addDoc(collection(db, "menu_melky"), {nama, harga, kategori, foto: fotoFinal});
                }
                alert('Berhasil menyimpan menu!');
                document.getElementById('adm-edit-id').value = '';
                document.getElementById('adm-nama').value = '';
                document.getElementById('adm-harga').value = '';
            };

            if(fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = async (e) => { await saveToDb(e.target.result); };
                reader.readAsDataURL(fileInput.files[0]);
            } else { await saveToDb(null); }
        };

        window.adminEditMenu = function(id, nama, harga, kategori) {
            document.getElementById('adm-edit-id').value = id;
            document.getElementById('adm-nama').value = nama;
            document.getElementById('adm-harga').value = harga;
            document.getElementById('adm-kategori').value = kategori;
        };

        window.adminHapusMenu = async function(id) {
            if(confirm('Hapus menu ini?')) {
                await deleteDoc(doc(db, "menu_melky", id));
            }
        };

        window.adminSimpanPengaturan = async function() {
            let metodeBayarConfig = document.getElementById('set-metode').value.trim();
            let noRekening = document.getElementById('set-rek').value.trim();
            let runningText = document.getElementById('set-promo').value.trim();
            await setDoc(doc(db, "pengaturan_melky", "config"), {metodeBayarConfig, noRekening, runningText}, {merge:true});
            alert('Pengaturan umum kafe disimpan!');
        };
    </script>
</head>
<body class="scene">
  <main class="app-shell">
    <header class="p-4 bg-stone-900 text-white flex justify-between items-center">
        <h2 id="kasir-title-badge" class="font-bold text-sm text-amber-400">Panel Admin Kasir</h2>
        <button onclick="exitKasir()" class="text-xs text-rose-400 font-bold px-2.5 py-1 bg-rose-900/30 rounded-lg">Keluar Kasir</button>
    </header>

    <div class="screen space-y-5">
        <!-- PROFIL KASIR -->
        <div class="bg-white p-4 rounded-2xl border border-stone-200 space-y-3 shadow-sm text-center">
            <img id="kasir-profile-img" class="w-16 h-16 rounded-full object-cover mx-auto border-2 border-amber-600 bg-stone-100 p-0.5">
            <div class="space-y-2 text-left">
                <div>
                    <label class="block text-[11px] font-bold text-stone-700 mb-1">Nama Kasir</label>
                    <input type="text" id="kasir-set-nama" class="form-field">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-stone-700 mb-1">Nomor WhatsApp Kasir</label>
                    <input type="text" id="kasir-set-wa" class="form-field">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-stone-700 mb-1">Ganti Foto Profil Kasir</label>
                    <input type="file" id="kasir-set-foto" accept="image/*" class="text-xs text-stone-600">
                </div>
            </div>
            <button onclick="adminSimpanProfilKasir()" class="action-btn text-xs py-2 bg-amber-600 mt-2">Simpan Profil Kasir</button>
        </div>

        <!-- TAMBAH / EDIT MENU -->
        <div class="bg-white p-4 rounded-2xl border border-stone-200 space-y-3 shadow-sm">
            <h3 class="font-bold text-xs text-stone-900">Kelola Menu Kafe</h3>
            <input type="hidden" id="adm-edit-id">
            <input type="text" id="adm-nama" placeholder="Nama Menu" class="form-field">
            <div class="grid grid-cols-2 gap-2">
                <input type="number" id="adm-harga" placeholder="Harga (Rp)" class="form-field">
                <select id="adm-kategori" class="form-field"><option value="Minuman">Minuman</option><option value="Makanan">Makanan</option><option value="Cemilan">Cemilan</option></select>
            </div>
            <input type="file" id="adm-file" accept="image/*" class="text-xs text-stone-600">
            <button onclick="adminSimpanMenu()" class="action-btn text-xs py-2.5">Simpan Menu</button>
            <div class="max-h-48 overflow-y-auto mt-2">
                <table class="w-full text-left text-xs">
                    <thead><tr class="text-stone-400 border-b"><th class="p-2">Foto</th><th class="p-2">Nama</th><th class="p-2">Harga</th><th class="p-2 text-center">Aksi</th></tr></thead>
                    <tbody id="admin-menu-tbody"><tr><td colspan="4" class="p-3 text-center text-stone-400">Memuat...</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- PENGATURAN UMUM -->
        <div class="bg-white p-4 rounded-2xl border border-stone-200 space-y-3 shadow-sm">
            <h3 class="font-bold text-xs text-stone-900">Pengaturan Pembayaran</h3>
            <input type="text" id="set-metode" placeholder="Metode (Cash, QRIS)" class="form-field">
            <input type="text" id="set-rek" placeholder="No Rekening" class="form-field">
            <input type="text" id="set-promo" placeholder="Running Text" class="form-field">
            <button onclick="adminSimpanPengaturan()" class="action-btn text-xs py-2.5 bg-emerald-600">Simpan Pengaturan</button>
        </div>

        <!-- LIVE ORDERS -->
        <div class="bg-white p-4 rounded-2xl border border-stone-200 space-y-3 shadow-sm">
            <h3 class="font-bold text-xs text-stone-900">Pesanan Masuk Live</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead><tr class="text-stone-400 border-b"><th class="p-2">Waktu</th><th class="p-2">Pemesan</th><th class="p-2">Pesanan</th><th class="p-2">Total</th><th class="p-2 text-center">Aksi</th></tr></thead>
                    <tbody id="admin-live-orders-tbody"><tr><td colspan="5" class="p-4 text-center text-stone-400">Menghubungkan...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
  </main>
</body>
</html>

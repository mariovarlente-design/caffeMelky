<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Kafe Melky</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --cream:#FAF8F5; --caramel:#B8860B; --ink:#30251e; }
        * { box-sizing:border-box; }
        body { margin:0; font-family:'DM Sans',sans-serif; color:var(--ink); background:#e6cbb4; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
        .app-shell { width:100%; max-width:420px; background:#fff; border-radius:30px; box-shadow:0 24px 70px rgba(0,0,0,0.2); overflow:hidden; padding:28px; }
        .serif { font-family:'Fraunces',serif; }
        .form-field { width:100%; border:1px solid #e6ddd2; border-radius:14px; padding:12px; background:#faf7f2; outline:none; font-size:13px; }
        .form-field:focus { border-color:var(--caramel); background:#fff; }
        .action-btn { background:var(--caramel); color:#fff; border-radius:14px; font-weight:700; padding:13px 16px; border:none; width:100%; cursor:pointer; transition:background 0.2s; }
        .action-btn:hover { background:#9a6f09; }
    </style>
</head>
<body>
    <div class="app-shell space-y-6">
        <div class="text-center space-y-1">
            <h2 class="serif text-2xl font-bold text-stone-900">Kafe Melky</h2>
            <p class="text-xs text-stone-500">Silakan pilih akses masuk Anda</p>
        </div>

        <!-- PILIH PERAN -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="pilihPeran('pelanggan')" id="btn-p-pelanggan" class="p-3 rounded-2xl border-2 border-amber-600 bg-amber-50 text-amber-900 font-bold text-xs text-center transition">Pelanggan</button>
            <button onclick="pilihPeran('kasir')" id="btn-p-kasir" class="p-3 rounded-2xl border-2 border-stone-200 bg-white text-stone-700 font-bold text-xs text-center transition">Kasir / Admin</button>
        </div>

        <!-- FORM PELANGGAN -->
        <div id="form-pelanggan-box" class="space-y-4">
            <div id="info-member-status" class="bg-stone-50 p-3 rounded-xl border border-stone-200 text-xs text-stone-600">
                Masukkan Nama dan No WhatsApp Anda untuk mulai memesan.
            </div>
            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">Nama Lengkap / No Meja</label>
                <input type="text" id="login-nama" placeholder="Cth: Budi / Meja 02" class="form-field">
            </div>
            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">Nomor WhatsApp</label>
                <input type="text" id="login-wa" placeholder="Cth: 628123456789" class="form-field">
            </div>
            <button onclick="masukSebagaiPelanggan()" class="action-btn">Masuk sebagai Pelanggan</button>
        </div>

        <!-- FORM KASIR -->
        <div id="form-kasir-box" class="space-y-4" hidden>
            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">Pilih Akun Kasir</label>
                <select id="login-kasir-pilih" class="form-field">
                    <option value="kasir1">Kasir 1</option>
                    <option value="kasir2">Kasir 2</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">Password Kasir</label>
                <input type="password" id="login-kasir-pass" placeholder="Masukkan password kasir..." class="form-field">
            </div>
            <button onclick="masukSebagaiKasir()" class="action-btn bg-stone-900 hover:bg-stone-800">Masuk Panel Kasir</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0ksXFs247mY7sAOlsDmdR_7kCyF5AVOc",
            authDomain: "cafe-melky.firebaseapp.com",
            projectId: "cafe-melky",
            storageBucket: "cafe-melky.firebasestorage.app",
            messagingSenderId: "563981647169",
            appId: "1:563981647169:web:f2815873b51787b9b375c0"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.pilihPeran = function(peran) {
            const btnP = document.getElementById('btn-p-pelanggan');
            const btnK = document.getElementById('btn-p-kasir');
            const boxP = document.getElementById('form-pelanggan-box');
            const boxK = document.getElementById('form-kasir-box');

            if(peran === 'pelanggan') {
                btnP.className = "p-3 rounded-2xl border-2 border-amber-600 bg-amber-50 text-amber-900 font-bold text-xs text-center transition";
                btnK.className = "p-3 rounded-2xl border-2 border-stone-200 bg-white text-stone-700 font-bold text-xs text-center transition";
                boxP.hidden = false;
                boxK.hidden = true;
            } else {
                btnK.className = "p-3 rounded-2xl border-2 border-amber-600 bg-amber-50 text-amber-900 font-bold text-xs text-center transition";
                btnP.className = "p-3 rounded-2xl border-2 border-stone-200 bg-white text-stone-700 font-bold text-xs text-center transition";
                boxK.hidden = false;
                boxP.hidden = true;
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            let saved = localStorage.getItem('melky_pelanggan');
            if(saved) {
                let p = JSON.parse(saved);
                document.getElementById('login-nama').value = p.nama || '';
                document.getElementById('login-wa').value = p.wa || '';
                document.getElementById('info-member-status').innerHTML = `✅ Selamat datang kembali, <b>${p.nama}</b>! Klik tombol di bawah untuk lanjut.`;
            }
        });

        window.masukSebagaiPelanggan = function() {
            let nama = document.getElementById('login-nama').value.trim();
            let wa = document.getElementById('login-wa').value.trim();
            if(!nama || !wa) { alert('Nama dan Nomor WhatsApp wajib diisi!'); return; }

            let pelangganData = {
                nama, wa,
                foto: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80',
                joinedAt: Date.now()
            };
            localStorage.setItem('melky_pelanggan', JSON.stringify(pelangganData));
            localStorage.removeItem('melky_active_kasir');
            window.location.href = 'index.html';
        };

        window.masukSebagaiKasir = async function() {
            let kasirId = document.getElementById('login-kasir-pilih').value;
            let pass = document.getElementById('login-kasir-pass').value;
            let defaultPass = kasirId === 'kasir1' ? 'kasir123' : 'kasir456';

            if(pass !== defaultPass) { alert('Password kasir salah!'); return; }

            const docRef = doc(db, "kasir_melky", kasirId);
            let docSnap = await getDoc(docRef);
            if(!docSnap.exists()) {
                await setDoc(docRef, {
                    id: kasirId,
                    nama: kasirId === 'kasir1' ? 'Kasir Utama 1' : 'Kasir Shift 2',
                    waKasir: kasirId === 'kasir1' ? '628123456789' : '628987654321',
                    foto: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=300&q=80'
                });
            }

            localStorage.setItem('melky_active_kasir', kasirId);
            localStorage.removeItem('melky_pelanggan');
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
